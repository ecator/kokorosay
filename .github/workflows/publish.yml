name: Upload Python Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing via OIDC token
      id-token: write

    steps:
      # 1. Check out code
      - uses: actions/checkout@v4

      # 2. Install and configure uv
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # 3. Build release distributions (dist/)
      - name: Build release distributions
        run: uv build

      # 4. Publish directly to PyPI
      # uv detects GitHub's id-token and handles OIDC exchange with PyPI without API tokens
      - name: Publish to PyPI
        run: uv publish
